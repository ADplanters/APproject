<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 340 60" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&amp;display=swap');
      .brand-text-en {
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        fill: #BA122B;
        font-size: 28px;
        letter-spacing: 1.8px;
      }
      .flower-symbol {
        fill: none;
        stroke: #BA122B;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <path id="petal-h" d="M -3.5,-6 C -8.8,-15.8 -4.8,-25.2 0,-25.2 C 4.8,-25.2 8.8,-15.8 3.5,-6" />
  </defs>

  <!-- 오리지널 6잎 심볼 -->
  <g transform="translate(32, 30)" class="flower-symbol">
    <use href="#petal-h" xlink:href="#petal-h" />
    <use href="#petal-h" xlink:href="#petal-h" transform="rotate(60)" />
    <use href="#petal-h" xlink:href="#petal-h" transform="rotate(120)" />
    <use href="#petal-h" xlink:href="#petal-h" transform="rotate(180)" />
    <use href="#petal-h" xlink:href="#petal-h" transform="rotate(240)" />
    <use href="#petal-h" xlink:href="#petal-h" transform="rotate(300)" />
  </g>

  <!-- 브랜드 영문 로고 텍스트 -->
  <text x="75" y="40" class="brand-text-en">PLACE PARTNER</text>
</svg>
