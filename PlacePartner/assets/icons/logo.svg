<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&amp;display=swap');
      
      .brand-text {
        font-family: 'Oswald', 'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif;
        font-weight: 700;
        fill: #BA122B;
        font-size: 52px;
        letter-spacing: 2.5px;
        text-anchor: middle;
      }
      
      .flower-symbol {
        fill: none;
        stroke: #BA122B;
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    
    <path id="petal" d="M -11.5,-19.9 C -29,-52 -16,-84 0,-84 C 16,-84 29,-52 11.5,-19.9" />
  </defs>

  <g transform="translate(250, 180)" class="flower-symbol">
    <use href="#petal" xlink:href="#petal" />
    <use href="#petal" xlink:href="#petal" transform="rotate(60)" />
    <use href="#petal" xlink:href="#petal" transform="rotate(120)" />
    <use href="#petal" xlink:href="#petal" transform="rotate(180)" />
    <use href="#petal" xlink:href="#petal" transform="rotate(240)" />
    <use href="#petal" xlink:href="#petal" transform="rotate(300)" />
  </g>

  <text x="250" y="355" class="brand-text">PLACE PARTNER</text>
</svg>
