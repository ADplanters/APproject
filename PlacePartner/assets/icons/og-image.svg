<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&amp;display=swap');

      .bg-grad { fill: url(#bg-gradient); }
      .brand-en { font-family: 'Oswald', sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 38px; letter-spacing: 2px; }
      .badge-text { font-family: 'Pretendard', sans-serif; font-weight: 800; fill: #BA122B; font-size: 18px; }
      .main-title { font-family: 'Pretendard', sans-serif; font-weight: 900; fill: #FFFFFF; font-size: 50px; letter-spacing: -1px; }
      .highlight-text { fill: #FFD1D6; }
      .sub-title { font-family: 'Pretendard', sans-serif; font-weight: 500; fill: #FCE8EA; font-size: 24px; }
      .feature-box { fill: rgba(255, 255, 255, 0.12); stroke: rgba(255, 255, 255, 0.25); stroke-width: 1.5; rx: 16; }
      .feature-text { font-family: 'Pretendard', sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 20px; }
      .flower-symbol { fill: none; stroke: #FFFFFF; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#830818" />
      <stop offset="50%" stop-color="#BA122B" />
      <stop offset="100%" stop-color="#4A020C" />
    </linearGradient>

    <path id="og-petal" d="M -4.5,-8 C -11,-20 -6,-32 0,-32 C 6,-32 11,-20 4.5,-8" />
  </defs>

  <rect width="1200" height="630" class="bg-grad" />

  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <g transform="translate(100, 100)">
    <g transform="translate(35, 25)" class="flower-symbol">
      <use href="#og-petal"/>
      <use href="#og-petal" transform="rotate(60)"/>
      <use href="#og-petal" transform="rotate(120)"/>
      <use href="#og-petal" transform="rotate(180)"/>
      <use href="#og-petal" transform="rotate(240)"/>
      <use href="#og-petal" transform="rotate(300)"/>
    </g>
    <text x="85" y="38" class="brand-en">PLACE PARTNER</text>
  </g>

  <g transform="translate(100, 185)">
    <rect width="320" height="40" rx="20" fill="#FFFFFF" />
    <text x="160" y="26" text-anchor="middle" class="badge-text">🔥 플레이스 SEO &amp; 전문 실행사</text>
  </g>

  <g transform="translate(100, 285)">
    <text x="0" y="0" class="main-title">
      네이버 플레이스 검색 흐름을 바꾸는
    </text>
    <text x="0" y="65" class="main-title">
      <tspan class="highlight-text">SEO 데이터 기반</tspan> 맞춤 마케팅 솔루션
    </text>
  </g>

  <text x="100" y="420" class="sub-title">
    검색 유입부터 문의 전환까지 체계적으로 설계합니다.
  </text>

  <g transform="translate(100, 475)">
    <g transform="translate(0, 0)">
      <rect width="310" height="64" class="feature-box" />
      <text x="155" y="40" text-anchor="middle" class="feature-text">📊 플레이스 SEO 최적화</text>
    </g>
    <g transform="translate(330, 0)">
      <rect width="310" height="64" class="feature-box" />
      <text x="155" y="40" text-anchor="middle" class="feature-text">🎬 숏폼 &amp; 리뷰 마케팅</text>
    </g>
    <g transform="translate(660, 0)">
      <rect width="340" height="64" class="feature-box" fill="rgba(255,255,255,0.22)" />
      <text x="170" y="40" text-anchor="middle" class="feature-text">🎁 압도적 무료 진단 제공</text>
    </g>
  </g>
</svg>
